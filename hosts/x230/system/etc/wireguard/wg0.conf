# marlinos (x230): WireGuard client of minix (10.77.0.0/24, split tunnel: only minix and
# the other peers go through it).
#
# The private key is /etc/wireguard/wg0.key, made on this machine:
#   sudo sh -c 'umask 077; wg genkey > /etc/wireguard/wg0.key'
#   sudo wg pubkey < /etc/wireguard/wg0.key     # -> a [Peer] in hosts/minix/.../wg0.conf
[Interface]
Address = 10.77.0.2/24
PostUp = wg set %i private-key /etc/wireguard/%i.key
# split DNS: only *.mesh goes to minix's dnsmasq; everything else stays on the wifi's DNS
PostUp = resolvectl dns %i 10.77.0.1; resolvectl domain %i '~mesh'; resolvectl default-route %i false || true

[Peer]
# minix
PublicKey = dXSp4aAaMbl8qH+niNV+nYNRrRTJmj4Fh3r9eq8jGmE=
Endpoint = 82.65.170.215:51821
AllowedIPs = 10.77.0.0/24
PersistentKeepalive = 25

# marlinos (minix): reached from outside, keys only.
Port 4242
PasswordAuthentication no
KbdInteractiveAuthentication no

# Passwords too, but only from the WireGuard mesh (10.77.0.0/24: peers holding a mesh key).
# fail2ban still bans an address after 3 wrong tries. Keep this block last in the file.
Match Address 10.77.0.0/24
    PasswordAuthentication yes

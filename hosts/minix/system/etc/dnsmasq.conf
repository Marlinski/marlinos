# marlinos (minix): DNS for the WireGuard mesh, on 10.77.0.1 only (wg0; nothing on wifi or lo).
# Laptops send only *.mesh here (split DNS, see wg0.conf PostUp). The phone sends everything
# while its tunnel is up: other names are forwarded to minix's own upstream DNS.
listen-address=10.77.0.1
bind-dynamic
no-hosts
domain-needed
bogus-priv
cache-size=1000

# upstream for non-mesh names: whatever DNS minix's wifi got, via systemd-resolved
resolv-file=/run/systemd/resolve/resolv.conf

# the mesh: never forwarded, unknown names are NXDOMAIN
local=/mesh/
# minix and anything under it (k3s ingress: app.minix.mesh)
address=/minix.mesh/10.77.0.1
host-record=x230.mesh,10.77.0.2
host-record=pixel8.mesh,10.77.0.3
host-record=jeanne.mesh,10.77.0.4

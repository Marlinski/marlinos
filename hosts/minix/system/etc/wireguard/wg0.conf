# marlinos (minix): WireGuard hub, 10.77.0.0/24. Peers reach minix and each other, nothing else
# (split tunnel: their internet traffic doesn't go through here).
# Reached from outside on 82.65.170.215:51821, forwarded by the Freebox to 192.168.1.143.
#
# Public keys only. The private key is /etc/wireguard/wg0.key (root only, made on this
# machine, never in the repo). Adding a peer: a [Peer] block here, then
#   sudo systemctl restart wg-quick@wg0
[Interface]
Address = 10.77.0.1/24
ListenPort = 51821
PostUp = wg set %i private-key /etc/wireguard/%i.key
# docker sets the FORWARD policy to DROP: let peers reach each other through minix
PostUp = iptables -I FORWARD -i %i -o %i -j ACCEPT
PostDown = iptables -D FORWARD -i %i -o %i -j ACCEPT
# split DNS: only *.mesh goes to minix's dnsmasq; everything else stays on the wifi's DNS
PostUp = resolvectl dns %i 10.77.0.1; resolvectl domain %i '~mesh'; resolvectl default-route %i false || true

[Peer]
# x230 (key made on the x230, hosts/x230/system/etc/wireguard/wg0.conf)
PublicKey = hDcMXuZ/IuF5/06TCFsB1HkgpE4HIayFkBxC2CkzqT4=
AllowedIPs = 10.77.0.2/32

[Peer]
# pixel8 (phone; key made on minix, config in /etc/wireguard/clients/pixel8.conf)
PublicKey = 1uehhU2Ez15lDM8ZTj2XDiIxneFNpU+w6TeJqIfzoXQ=
AllowedIPs = 10.77.0.3/32

[Peer]
# jeanne (ThinkPad; key made on minix, config in /etc/wireguard/clients/jeanne.conf)
PublicKey = 5qrKuYoK4jC/RdKMkTe8sB/b+GmX7sDdaA/Tkbh88kw=
AllowedIPs = 10.77.0.4/32

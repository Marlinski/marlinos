# tmux: Tokyo Night, no plugins. Prefix Ctrl+Space (Ctrl+b works too); prefix q reloads.
# Colors: bg 1a1b26, dark 16161e, highlight 292e42, border 3b4261, fg c0caf5, comment 565f89,
#         blue 7aa2f7, cyan 7dcfff, purple bb9af7, green 9ece6a, yellow e0af68, red f7768e

# ---------------------------------------------------------------- prefix
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix
bind q source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# ---------------------------------------------------------------- terminal
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB,*:clipboard,*:usstyle,xterm-kitty:extkeys"
set -g extended-keys on
set -g extended-keys-format xterm   # csi-u sent a plain Esc as ESC[27u ("27u" in apps)
set -g set-clipboard on             # OSC 52: yanks reach the system clipboard, over ssh too
set -g allow-passthrough on
set -g focus-events on
set -sg escape-time 10
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on
set -g detach-on-destroy off        # closing a session moves to the next one
set -g set-titles on
set -g set-titles-string "#h: #W"
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

# ---------------------------------------------------------------- copy mode (vi)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ---------------------------------------------------------------- panes
bind -n M-Enter split-window -v -c "#{pane_current_path}"
bind -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -n M-Escape kill-pane
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind x kill-pane
bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D
bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5
bind S setw synchronize-panes

# ---------------------------------------------------------------- windows
bind c new-window -c "#{pane_current_path}"
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind k kill-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# ---------------------------------------------------------------- sessions
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P switch-client -p
bind N switch-client -n
bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

# ---------------------------------------------------------------- popups
# prefix s / w: tmux's own session and window tree, with previews (zoomed to the whole window)
bind s choose-tree -Zs
bind w choose-tree -Zw
# prefix g: lazygit, t: a scratch shell in this directory
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" -T " lazygit " lazygit
bind t display-popup -E -w 80% -h 75% -d "#{pane_current_path}" -T " shell "

# ---------------------------------------------------------------- look
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#16161e,fg=#565f89"
set -g status-left-length 40
set -g status-right-length 80
set -g window-status-separator ""

# session pill: blue, purple while the prefix is held
set -g status-left "#[fg=#{?client_prefix,#bb9af7,#7aa2f7},bg=#16161e]#[fg=#16161e,bg=#{?client_prefix,#bb9af7,#7aa2f7},bold] #S#[fg=#{?client_prefix,#bb9af7,#7aa2f7},bg=#16161e,nobold] "

# windows: dim, the current one in a pill; zoomed mark; a window with new output has its name in bold yellow
set -g window-status-format "#[fg=#565f89] #I #{?window_activity_flag,#[fg=#e0af68#,bold],#[fg=#737aa2]}#W#[nobold]#{?window_zoomed_flag, 󰊓,} "
set -g window-status-current-format "#[fg=#292e42,bg=#16161e]#[fg=#7aa2f7,bg=#292e42,bold]#I #[fg=#c0caf5,nobold]#W#{?window_zoomed_flag,#[fg=#7dcfff] 󰊓,}#[fg=#292e42,bg=#16161e]"
# (tmux's default activity style reverses the whole tab)
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style none
setw -g window-status-bell-style none

# right: copy / sync / prefix states, then the host
set -g status-right "#{?pane_in_mode,#[fg=#e0af68]󰆏 copy  ,}#{?pane_synchronized,#[fg=#f7768e]󰓦 sync  ,}#{?client_prefix,#[fg=#bb9af7]󰌌 prefix  ,}#[fg=#292e42]#[fg=#9ece6a,bg=#292e42] #[fg=#c0caf5]#h#[fg=#292e42,bg=#16161e]"

set -g pane-border-lines single
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-indicators arrows
set -g display-panes-colour "#565f89"
set -g display-panes-active-colour "#7aa2f7"

set -g message-style "bg=#292e42,fg=#7aa2f7"
set -g message-command-style "bg=#292e42,fg=#bb9af7"
set -g mode-style "bg=#2e3c64,fg=#c0caf5"
set -g copy-mode-match-style "bg=#3d59a1,fg=#c0caf5"
set -g copy-mode-current-match-style "bg=#ff9e64,fg=#16161e"
set -g popup-style "bg=#1a1b26"
set -g popup-border-style "fg=#7aa2f7"
set -g popup-border-lines rounded
set -g menu-style "bg=#1a1b26,fg=#c0caf5"
set -g menu-selected-style "bg=#292e42,fg=#7aa2f7"
set -g menu-border-style "fg=#3b4261"
set -g menu-border-lines rounded
setw -g clock-mode-colour "#7aa2f7"

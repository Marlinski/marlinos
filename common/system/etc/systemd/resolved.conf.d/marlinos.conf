# marlinos: systemd-resolved answers /etc/resolv.conf (its stub, 127.0.0.53), with per-link DNS:
# each wifi/ethernet uses the DNS its network hands out (captive portals keep working), and
# wg0 adds only the mesh's own names (*.mesh -> minix, set by wg0.conf's PostUp).
[Resolve]
# avahi does mDNS; LLMNR isn't used here
MulticastDNS=no
LLMNR=no

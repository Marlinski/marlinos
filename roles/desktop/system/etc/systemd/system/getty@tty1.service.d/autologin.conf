# marlinos: silent autologin on tty1, ~/.bash_profile then starts Hyprland.
# No login line, no hostname, no clear: the last splash frame stays up until Hyprland draws.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -f -- \\u' --noclear --noissue --skip-login --nohostname --nonewline --autologin @USER@ %I $TERM

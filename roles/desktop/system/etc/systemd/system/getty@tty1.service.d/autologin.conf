# marlinos: silent autologin on tty1, ~/.bash_profile then starts Hyprland.
# No login line, no hostname. The screen is cleared while the splash still covers it: when plymouth quits,
# the kernel shows the console again (with GRUB's "Loading Linux" lines still on it), so it must be blank.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -f -- \\u' --noissue --skip-login --nohostname --nonewline --autologin @USER@ %I $TERM

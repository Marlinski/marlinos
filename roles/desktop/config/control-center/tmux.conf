# marlinos: the control center's tmux (its own server, -L control-center): btop on top,
# the status panel along the bottom. Not the everyday tmux config.
set -g default-terminal tmux-256color
set -ga terminal-features ',alacritty*:RGB'
set -g status off
set -g mouse on
set-hook -g client-detached kill-server   # window closed: stop btop and the panel too
set -g pane-border-style fg=#414868
set -g pane-active-border-style fg=#414868

# started detached: give it a big size so btop is tall from the first frame (tmux scales the
# panes to the real window when it attaches)
set -g default-size 200x60
new-session -d -s cc btop
split-window -t cc -v -l 12 ~/.local/bin/status-panel   # it then fits its pane to its content
select-pane -t cc -U

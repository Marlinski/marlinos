# marlinos: the control center's tmux (its own server, -L control-center): btop on the left,
# the status panel on the right. Not the everyday tmux config.
set -g default-terminal tmux-256color
set -ga terminal-features ',alacritty*:RGB'
set -g status off
set -g mouse on
set-hook -g client-detached kill-server   # window closed: stop btop and the panel too
set -g pane-border-style fg=#414868
set -g pane-active-border-style fg=#414868

new-session -d -s cc btop
split-window -t cc -h -l 54 ~/.local/bin/status-panel
select-pane -t cc -L

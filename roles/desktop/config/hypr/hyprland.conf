# marlinos Hyprland config (single file, Hyprland 0.56+)

monitor = , preferred, auto, 1

$terminal = uwsm app -- alacritty
$browser  = uwsm app -- firefox
$menu     = fuzzel --launch-prefix="uwsm app -- "

# ---------------------------------------------------------------- autostart
exec-once = uwsm app -- waybar
exec-once = uwsm app -- mako
exec-once = uwsm app -- hypridle
exec-once = uwsm app -- /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# ---------------------------------------------------------------- look
# Tokyo Night palette: bg 1a1b26, fg c0caf5, blue 7aa2f7, grey 414868
general {
    gaps_in = 3
    gaps_out = 6
    border_size = 2
    col.active_border = rgb(7aa2f7)
    col.inactive_border = rgb(414868)
    layout = dwindle
}

decoration {
    rounding = 0
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = quick, 0.15, 0, 0.1, 1
    animation = global, 1, 3, quick
    animation = workspaces, 1, 2, quick, slide
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(1a1b26)
    focus_on_activate = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# ---------------------------------------------------------------- input
input {
    kb_layout = us
    kb_options = compose:caps
    repeat_rate = 40
    repeat_delay = 600
    numlock_by_default = true
    follow_mouse = 1
    touchpad {
        natural_scroll = false
        scroll_factor = 0.4
    }
}

# ---------------------------------------------------------------- apps
bindd = SUPER, Return, Terminal, exec, $terminal
bindd = SUPER, Space, Launcher, exec, $menu
bindd = SUPER, B, Browser, exec, $browser
bindd = SUPER SHIFT, B, Browser (private), exec, $browser --private-window
bindd = SUPER, F, File manager, exec, $terminal -e ranger
bindd = SUPER, T, Activity, exec, $terminal -e btop
bindd = SUPER, N, Editor, exec, $terminal -e nvim
bindd = SUPER, A, Claude, exec, $terminal -e claude
bindd = SUPER, M, Music, exec, ~/.local/bin/music

# ---------------------------------------------------------------- session
bindd = SUPER, Escape, Lock, exec, loginctl lock-session
bindd = SUPER SHIFT, Escape, Exit Hyprland, exec, uwsm stop
bindd = SUPER CTRL, Escape, Suspend, exec, systemctl suspend
bindd = SUPER SHIFT, Space, Toggle bar, exec, pkill -SIGUSR1 waybar

# ---------------------------------------------------------------- windows
bindd = SUPER SHIFT, Q, Close window, killactive,
bindd = SUPER, W, Close window, killactive,
bindd = SUPER, V, Toggle floating, togglefloating,
bindd = SUPER, J, Toggle split, layoutmsg, togglesplit
bindd = , F11, Fullscreen, fullscreen, 0
bindd = SUPER SHIFT, F, Maximize, fullscreen, 1

bindd = SUPER, left, Focus left, movefocus, l
bindd = SUPER, right, Focus right, movefocus, r
bindd = SUPER, up, Focus up, movefocus, u
bindd = SUPER, down, Focus down, movefocus, d
bindd = SUPER SHIFT, left, Move left, exec, ~/.local/bin/hypr-move l
bindd = SUPER SHIFT, right, Move right, exec, ~/.local/bin/hypr-move r
bindd = SUPER SHIFT, up, Move up, exec, ~/.local/bin/hypr-move u
bindd = SUPER SHIFT, down, Move down, exec, ~/.local/bin/hypr-move d
bindd = SUPER, minus, Shrink width, resizeactive, -60 0
bindd = SUPER, equal, Grow width, resizeactive, 60 0
bindd = SUPER SHIFT, minus, Shrink height, resizeactive, 0 -60
bindd = SUPER SHIFT, equal, Grow height, resizeactive, 0 60

bindmd = SUPER, mouse:272, Move window, movewindow
bindmd = SUPER, mouse:273, Resize window, resizewindow


# ---------------------------------------------------------------- workspaces
bindd = SUPER, 1, Workspace 1, workspace, 1
bindd = SUPER, 2, Workspace 2, workspace, 2
bindd = SUPER, 3, Workspace 3, workspace, 3
bindd = SUPER, 4, Workspace 4, workspace, 4
bindd = SUPER, 5, Workspace 5, workspace, 5
bindd = SUPER, 6, Workspace 6, workspace, 6
bindd = SUPER, 7, Workspace 7, workspace, 7
bindd = SUPER, 8, Workspace 8, workspace, 8
bindd = SUPER, 9, Workspace 9, workspace, 9
bindd = SUPER SHIFT, 1, Move to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, 2, Move to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, 3, Move to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, 4, Move to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, 5, Move to workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, 6, Move to workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, 7, Move to workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, 8, Move to workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, 9, Move to workspace 9, movetoworkspace, 9
bindd = SUPER, Tab, Next workspace, workspace, e+1
bindd = SUPER SHIFT, Tab, Previous workspace, workspace, e-1
bindd = SUPER, Prior, Previous workspace, workspace, e-1
bindd = SUPER, Next, Next workspace, workspace, e+1
bindd = SUPER SHIFT, Prior, Move to previous workspace, movetoworkspace, e-1
bindd = SUPER SHIFT, Next, Move to next workspace, movetoworkspace, e+1

# ---------------------------------------------------------------- hardware keys
bindeld = , XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindeld = , XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindld = , XF86AudioMute, Mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindld = , XF86AudioMicMute, Mute mic, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindeld = , XF86MonBrightnessUp, Brightness up, exec, brightnessctl set 5%+
bindeld = , XF86MonBrightnessDown, Brightness down, exec, brightnessctl set 5%-
bindld = , XF86AudioPlay, Play/pause, exec, playerctl play-pause
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous

# ---------------------------------------------------------------- capture
bindd = , Print, Screenshot region, exec, hyprshot -m region -o "$(xdg-user-dir PICTURES)"
bindd = SHIFT, Print, Screenshot window, exec, hyprshot -m window -o "$(xdg-user-dir PICTURES)"
bindd = CTRL, Print, Screenshot screen, exec, hyprshot -m output -o "$(xdg-user-dir PICTURES)"
bindd = ALT, Print, Screen recording, exec, ~/.local/bin/screenrecord
bindd = SUPER, Print, Color picker, exec, hyprpicker -a

# ---------------------------------------------------------------- this machine
# hosts/<host>/hypr.conf (monitors, input quirks...). Every desktop host must have one.
source = ~/.config/marlinos/host/hypr.conf

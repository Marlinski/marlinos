general {
    hide_cursor = true
}

background {
    color = rgb(1a1b26)
}

label {
    text = $TIME
    color = rgb(c0caf5)
    font_size = 64
    font_family = CaskaydiaMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    size = 300, 50
    outline_thickness = 2
    outer_color = rgb(7aa2f7)
    inner_color = rgb(1a1b26)
    font_color = rgb(c0caf5)
    check_color = rgb(e0af68)
    fail_color = rgb(f7768e)
    placeholder_text = password
    fade_on_empty = false
    rounding = 0
    position = 0, -20
    halign = center
    valign = center
}

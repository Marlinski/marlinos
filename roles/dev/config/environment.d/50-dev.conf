# marlinos dev role: every toolchain keeps its files under the XDG dirs, not in ~/.cargo, ~/go,
# ~/.npm, ~/.rustup... Installed programs land in ~/.local/bin (already on PATH).
# Read by the systemd user session (so the desktop and its apps get it) and by fish (conf.d/dev.fish).
GOPATH=$HOME/.local/share/go
GOMODCACHE=$HOME/.cache/go/mod
GOBIN=$HOME/.local/bin
CARGO_HOME=$HOME/.local/share/cargo
CARGO_INSTALL_ROOT=$HOME/.local
RUSTUP_HOME=$HOME/.local/share/rustup
NPM_CONFIG_CACHE=$HOME/.cache/npm
NPM_CONFIG_PREFIX=$HOME/.local
NODE_REPL_HISTORY=$HOME/.local/state/node_repl_history
PYTHON_HISTORY=$HOME/.local/state/python_history
PYTHONPYCACHEPREFIX=$HOME/.cache/python
